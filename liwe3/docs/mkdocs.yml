site_name: LiWE3 Monorepo Documentation
site_description: Documentation for the Cloudflare Workers monorepo with backend modules, frontend libraries, and applications
site_author: LiWE3 Team
site_url: https://liwe3.dev

# Repository
repo_name: cf-liwe3-monorepo
repo_url: https://github.com/yourusername/cf-liwe3-monorepo
edit_uri: edit/main/docs/source/

# Copyright
copyright: Copyright &copy; 2025 LiWE3

# Directory configuration
docs_dir: source
site_dir: website

# Configuration
theme:
    name: material
    language: en
    palette:
        # Light mode
        - media: "(prefers-color-scheme: light)"
          scheme: default
          primary: indigo
          accent: indigo
          toggle:
              icon: material/brightness-7
              name: Switch to dark mode
        # Dark mode
        - media: "(prefers-color-scheme: dark)"
          scheme: slate
          primary: indigo
          accent: indigo
          toggle:
              icon: material/brightness-4
              name: Switch to light mode
    font:
        text: Roboto
        code: Roboto Mono
    features:
        - navigation.instant
        - navigation.instant.prefetch
        - navigation.tracking
        - navigation.tabs
        - navigation.tabs.sticky
        # - navigation.sections  # Commented out to enable proper hierarchical indentation
        # - navigation.expand  # Commented out to keep sections collapsed by default
        - navigation.path
        # - navigation.indexes  # Commented out to enable expand/collapse on section headers
        - navigation.top
        - navigation.footer
        - search.suggest
        - search.highlight
        - search.share
        - toc.follow
        - toc.integrate
        - content.code.copy
        - content.code.annotate
        - content.tabs.link
    icon:
        repo: fontawesome/brands/github
        admonition:
            note: octicons/tag-16
            abstract: octicons/checklist-16
            info: octicons/info-16
            tip: octicons/squirrel-16
            success: octicons/check-16
            question: octicons/question-16
            warning: octicons/alert-16
            failure: octicons/x-circle-16
            danger: octicons/zap-16
            bug: octicons/bug-16
            example: octicons/beaker-16
            quote: octicons/quote-16

# Plugins
plugins:
    - search:
          separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
          lang: en
    - minify:
          minify_html: true
          minify_js: true
          minify_css: true
          htmlmin_opts:
              remove_comments: true
          cache_safe: true

# Extensions
markdown_extensions:
    # Python Markdown
    - abbr
    - admonition
    - attr_list
    - def_list
    - footnotes
    - md_in_html
    - toc:
          permalink: true
          permalink_title: Anchor link to this section
          toc_depth: 3
    # Python Markdown Extensions
    - pymdownx.arithmatex:
          generic: true
    - pymdownx.betterem:
          smart_enable: all
    - pymdownx.caret
    - pymdownx.details
    - pymdownx.emoji:
          emoji_index: !!python/name:material.extensions.emoji.twemoji
          emoji_generator: !!python/name:material.extensions.emoji.to_svg
    - pymdownx.highlight:
          anchor_linenums: true
          line_spans: __span
          pygments_lang_class: true
    - pymdownx.inlinehilite
    - pymdownx.keys
    - pymdownx.mark
    - pymdownx.smartsymbols
    - pymdownx.snippets:
          base_path: [source]
          auto_append:
              - includes/abbreviations.md
          check_paths: true
    - pymdownx.superfences:
          custom_fences:
              - name: mermaid
                class: mermaid
                format: !!python/name:pymdownx.superfences.fence_code_format
    - pymdownx.tabbed:
          alternate_style: true
    - pymdownx.tasklist:
          custom_checkbox: true
    - pymdownx.tilde

# Extra
extra:
    social:
        - icon: fontawesome/brands/github
          link: https://github.com/yourusername/cf-liwe3-monorepo
          name: GitHub Repository
    version:
        provider: mike
        default: latest
    generator: false

# Extra CSS
extra_css:
    - stylesheets/extra.css

# Extra JavaScript
extra_javascript:
    - javascripts/extra.js
    - javascripts/mathjax.js
    - https://polyfill.io/v3/polyfill.min.js?features=es6
    - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

# Page tree
nav:
    - Home: index.md
    - Backend:
          - Overview: backend/index.md
          - Core Library:
                - Overview: backend/liwe3/index.md
                - App: backend/liwe3/app.md
                - Challenge: backend/liwe3/challenge.md
                - Config: backend/liwe3/config.md
                - Conversions: backend/liwe3/conv.md
                - Crypto: backend/liwe3/crypto.md
                - Date Utils: backend/liwe3/date.md
                - Database: backend/liwe3/db.md
                - ID Generation: backend/liwe3/mkid.md
                - Permissions: backend/liwe3/permissions.md
          - Response: backend/liwe3/response.md
          - Logger: backend/liwe3/logger.md
          - Session: backend/liwe3/session.md
          - Types: backend/liwe3/types.md
          - Utils: backend/liwe3/utils.md
          - Modules:
                - Overview: backend/modules/index.md
                - System: backend/modules/system.md
                - User: backend/modules/user.md
          - Architecture:
                - Multi-Tier: backend/multi-tier.md
                - Specs: backend/specs2.md
          - Best Practices:
                - User Session: backend/best-practices/user-session.md
    - Frontend:
          - Overview: frontend/liwe3/index.md
    - Includes:
          - Abbreviations: includes/abbreviations.md
    - Scripts:
          - Overview: scripts/index.md
          - Development Automation:
                - Branch Change: scripts/change-branch.md
                - Git Secrets: scripts/git-secrets.md
