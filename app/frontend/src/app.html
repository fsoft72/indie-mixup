<!DOCTYPE html>
<html lang="en" data-theme="dark" data-brand="cyberpunk">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="dark" />
		<meta name="theme-color" content="#0b0a1a" />
		<link rel="preload" href="%sveltekit.assets%/fonts/orbitron-latin.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
		<link rel="stylesheet" href="%sveltekit.assets%/fonts/fonts.css" />
		<script>
		// Anti-FOUC (docs/THEME.md): the site is dark only, with the cyberpunk brand
		( function() {
			var d = document.documentElement;
			d.setAttribute( 'data-theme', 'dark' );
			d.setAttribute( 'data-brand', 'cyberpunk' );
		} )();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
