<!DOCTYPE html>
<html lang="en" data-theme="dark" data-brand="cyberpunk">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="dark" />
		<meta name="theme-color" content="#0b0a1a" />
		<meta name="description" content="Download free indie games straight from their GitHub repos, fork the idea and publish your own remix." />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Indie Mixup" />
		<meta property="og:title" content="Indie Mixup - free indie games and remixes" />
		<meta property="og:description" content="Download free indie games straight from their GitHub repos, fork the idea and publish your own remix." />
		<meta property="og:url" content="https://indiemixup.org/" />
		<meta property="og:image" content="https://indiemixup.org/power.webp" />
		<meta property="og:image:type" content="image/webp" />
		<meta property="og:image:width" content="1280" />
		<meta property="og:image:height" content="720" />
		<meta property="og:image:alt" content="Indie Mixup - Power to the players" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:image" content="https://indiemixup.org/power.webp" />
		<link rel="preload" href="%sveltekit.assets%/fonts/orbitron-latin.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
		<link rel="stylesheet" href="%sveltekit.assets%/fonts/fonts.css" />
		<script>
		// Anti-FOUC (docs/THEME.md): the site is dark only, with the cyberpunk brand
		( function() {
			var d = document.documentElement;
			d.setAttribute( 'data-theme', 'dark' );
			d.setAttribute( 'data-brand', 'cyberpunk' );
		} )();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
