# Framework rules of scripts/liwe3-update.sh.
#
# This file is shipped by cf-liwe3-ng and read from the fresh clone at every run,
# so every consumer app gets the updated rules. Do NOT put app specific rules
# here: use scripts/data/liwe3-update.local.conf (see the .example file).
#
# [skip]            paths that are NEVER copied from cf-liwe3-ng into the app
# [copy-if-missing] paths that are copied ONLY when they do not already exist in the app
#
# Matching rules:
#   - an entry ending with "/" matches the whole directory (prefix match)
#   - any other entry matches that exact file path
# Blank lines and lines starting with "#" are ignored.

[skip]
CHANGES.md
pnpm-lock.yaml
pnpm-workspace.yaml
.github/
playground/
work/wip/
PNPM-12.md
README.md
.rafter.yml
# Rules of the app (and the old single config file): never overwritten
scripts/data/liwe3-update.local.conf
scripts/data/liwe3-update.conf

[copy-if-missing]
app/
tsconfig.json
package.json
# The app owns its version of these: list of modules in use, project
# instructions, ignore rules, formatter config
tsconfig.backend.json
AGENTS.md
.gitignore
dprint.json
